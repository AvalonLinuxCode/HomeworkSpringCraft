spring:
  application:
    name: edu-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edu_platform}
    username: ${DB_USER:edu_user}
    password: ${DB_PASSWORD:edu_password}
  sql:
    init:
      # DDL 由 docs/Design_Description/schema.sql 手工/测试执行，启动时绝不自动建表
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
