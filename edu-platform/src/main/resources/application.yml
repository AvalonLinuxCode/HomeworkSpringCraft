spring:
  application:
    name: edu-platform
  datasource:
    # 本地 PostgreSQL 18 实例监听 5433（安装时改过端口）；生产环境用 DB_URL 覆盖
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/edu_platform}
    username: ${DB_USER:edu_user}
    password: ${DB_PASSWORD:edu_password}
  sql:
    init:
      # DDL 由 docs/Design_Description/schema.sql 手工/测试执行，启动时绝不自动建表
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
